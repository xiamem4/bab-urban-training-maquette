const fmtE=n=>(n%1?n.toFixed(2).replace(".",","):String(n))+" €";

const pdate=d=>{const[a,b,c]=d.split("/").map(Number);return{d:a,m:b,y:c}};
function invs(s){const[d,m,y]=s.st.split("/").map(Number),out=[],T=20261110;const ok=(yy,mm,dd)=>yy*10000+mm*100+dd<=T;
if(s.per=="y"||s.per=="u"){if(ok(y,m,d))out.push({d:s.st,l:s.plan,a:s.amt,ok:true})}
else{const st=s.per=="q"?3:1;let mm=m,yy=y;while(ok(yy,mm,d)){out.push({d:pad2(d)+"/"+pad2(mm)+"/"+yy,l:s.plan+(st==1?" · "+MFULL[mm-1]:""),a:s.amt,ok:true});mm+=st;while(mm>12){mm-=12;yy++}}}
if(s.pay=="fail"&&out.length)out[out.length-1].ok=false;return out.reverse()}
function allInv(){const o=[];SUBS.forEach(s=>invs(s).forEach(i=>o.push(Object.assign({s},i))));return o}
function caMonth(m,y){return allInv().filter(i=>i.ok&&pdate(i.d).m==m&&pdate(i.d).y==y).reduce((t,i)=>t+i.a,0)}
function caChart(){const L=[6,7,8,9,10,11].map(m=>({m,v:caMonth(m,2026)})),mx=Math.max(...L.map(x=>x.v))||1;
return`<div class="cbars" role="img" aria-label="Chiffre d'affaires des six derniers mois : ${L.map(x=>MONTHS[x.m-1]+" "+fmtE(Math.round(x.v))).join(", ")}">${L.map(x=>`<div class="${x.m==11?"cur":""}"><b>${Math.round(x.v)} €</b><i style="height:${Math.max(2,x.v/mx*100)}%"></i><span>${MONTHS[x.m-1]}${x.m==11?" (en cours)":""}</span></div>`).join("")}</div>`}

function spark(){const mx=Math.max(...TRAF),mn=Math.min(...TRAF),W=300,H=60,pts=TRAF.map((v,i)=>[i/(TRAF.length-1)*W,H-6-(v-mn)/(mx-mn)*(H-12)]);const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Visites du site vitrine sur 30 jours"><polygon points="0,${H} ${line} ${W},${H}" fill="var(--tint)"/><polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}

function recList(s,del){const g={};s.rec.slice().sort((a,b)=>b.dt.localeCompare(a.dt)).forEach(r=>{(g[r.d]=g[r.d]||[]).push(r)});const names=Object.keys(g).sort((a,b)=>a.localeCompare(b,"fr"));return names.length?names.map(n=>`<div class="rg"><h3>${esc(n)}</h3>${g[n].map((r,i)=>`<div class="inv"><span><b>${esc(r.v)}</b>${i==0?' <span class="pill y">Plus récent</span>':""}</span><span class="mute">${fmtD(r.dt)}</span>${del?`<button class="btn ghost sm" data-a="delarec" data-v="${r.id}" aria-label="Supprimer le record ${esc(n)} du ${fmtD(r.dt)}">Supprimer</button>`:""}</div>`).join("")}</div>`).join(""):`<p class="mute">Aucun record pour l'instant.</p>`}

function wkDone(i){let m=0;PV.filter(x=>x.wk==0&&x.day==i).forEach(x=>{m+=DONE.has(x.id)?x.d:Math.round(x.d*(PRG[x.id]||0)/100)});PLAN.filter(x=>x.wk==0&&x.day==i&&x.done).forEach(x=>m+=x.m||0);return m}
function wkPlanned(wk){return PV.filter(x=>x.wk==wk).reduce((a,x)=>a+x.d,0)+PLAN.filter(x=>x.wk==wk).reduce((a,x)=>a+(x.m||0),0)}
function wkSum(wk){const pl=wkPlanned(wk);if(wk!=0)return`<div class="wsum"><span><b class="big2">${pl}</b> <span class="mute">min prévues cette semaine</span></span></div>`;
const dn=[0,1,2,3,4,5,6].map(wkDone),tot=dn.reduce((a,b)=>a+b,0),act=dn.filter(m=>m>0).length,st=STREAK_PREV+(tot>0?1:0);
return`<div class="wsum"><div class="row-h" style="margin:0"><span><b class="big2">${tot}</b> <span class="mute">min effectuées sur ${pl} prévues cette semaine</span></span><span class="cnt">${act} jour${act>1?"s":""} actif${act>1?"s":""}</span></div><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${pl}" aria-valuenow="${tot}" aria-label="Minutes effectuées sur les minutes prévues"><i style="width:${Math.min(100,pl?tot/pl*100:0)}%"></i></div><div class="stk"><div class="sdots" aria-hidden="true">${[0,1,2,3].map(()=>"<i></i>").join("")}<i class="${tot>0?"":"c"}"></i></div><p><b>${st} semaine${st>1?"s":""}</b> d'affilée avec au moins 1 entraînement</p></div></div>`}

const idKind=v=>/@/.test(v)||!/^[+\d][\d\s.()-]*$/.test(String(v).trim())?"mail":"tel";

const idOk=v=>idKind(v)=="tel"?telNorm(v).length==10:/^\S+@\S+\.\S+$/.test(String(v).trim());
const roleOf=v=>{if(idKind(v)=="tel"){const d=telNorm(v);return{"0600000001":"admin","0698765432":"coach","0645678901":"full"}[d]||"fit"}const m=String(v).toLowerCase();return m.includes("barbara")?"admin":m.includes("marc")?"coach":m.includes("camille")?"full":"fit"};

8 76 54 32","Coaching · code par SMS"],["camille.laurent@mail.fr","Vidéothèque + coaching"],["barbara@bab-urban-training.com","Administratrice"]].map(x=>`<button type="button" data-a="demomail" data-v="${x[0]}">${x[0]}<span>${x[1]}</span></button>`).join("")}</div>`}</form></div></section>`}
